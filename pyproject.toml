[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "churn-survival"
version = "0.1.0"
description = "Churn Survival Analysis System — from heterogeneous customer data to a ranked, explainable risk report."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas",
    "pyarrow",
    "pydantic>=2",
    "lifelines",
    "scikit-learn",
    "numpy",
    "scipy",
    "joblib",
    "structlog",
    "pydantic-settings",
    "pyyaml",
    "openpyxl",
]

[project.optional-dependencies]
orchestration = [
    "langgraph",
    "langchain-core",
]
llm = [
    "httpx",
]
api = [
    "fastapi>=0.115",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "python-multipart>=0.0.18",
]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "pip-audit",
    "fastapi>=0.115",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "python-multipart>=0.0.18",
]
pandera = [
    "pandera",
]

[project.scripts]
churn-survival = "pipeline.main:main"
churn-survival-api = "api.main:run"

[tool.hatch.build.targets.wheel]
packages = [
    "adapters",
    "churn_io",
    "schemas",
    "router",
    "node1",
    "node2",
    "node3",
    "node4",
    "node5",
    "orchestration",
    "api",
    "config",
    "pipeline",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov --cov-report=term-missing"
markers = [
    "llm: live LLM calls; run only when RUN_LLM_TESTS is set (never in CI)",
    "golden: Node 3 golden-set quality gate (offline deterministic extractor)",
]

[tool.coverage.run]
branch = true
source = [
    "adapters",
    "churn_io",
    "schemas",
    "router",
    "node1",
    "node2",
    "node3",
    "node4",
    "node5",
    "orchestration",
    "api",
    "config",
    "pipeline",
    "logging_setup",
]

[tool.coverage.report]
fail_under = 0
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["schemas.*"]
strict = true