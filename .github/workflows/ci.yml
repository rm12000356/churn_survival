name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    # CI has no .env (gitignored): declare the settings the suite needs.
    env:
      REFERENCE_DATE: "2026-08-15"   # declared cut-off (dataset 7), never "today"
      LLM_PROVIDER: none             # CI never calls a live LLM
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Typecheck (mypy schemas)
        run: mypy schemas

      # Accepted advisories live in .github/pip-audit-ignore.txt, each with a reason.
      - name: Dependency audit (known CVEs)
        run: |
          ignores=$( (grep -vE '^[[:space:]]*(#|$)' .github/pip-audit-ignore.txt || true) \
            | awk '{printf "--ignore-vuln %s ", $1}')
          pip-audit --skip-editable $ignores

      # D-H5: the dataset 7 corpus is gitignored runtime data. CI regenerates it
      # deterministically (fixed master seed) and verifies the pinned golden
      # hashes via scripts/validate_dataset7.py + tests/dataset7 + tests/golden,
      # so generator determinism is exercised on the CI platform.
      # Contingency: if cross-platform drift ever appears, force-add the corpus.
      - name: Generate dataset 7 corpus
        run: python scripts/generate_dataset7.py

      - name: Validate dataset 7 corpus (58 checks)
        run: python scripts/validate_dataset7.py

      - name: Tests (incl. Node 3 golden gate + reproducibility audit)
        run: pytest
