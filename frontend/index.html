<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Horizon — Churn Risk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="wordmark">Horizon</div>
      <nav class="nav" id="nav">
        <a href="#/upload" data-nav="upload">Upload</a>
        <a href="#/runs" data-nav="runs">Runs</a>
        <a href="#/models" data-nav="models">Models</a>
      </nav>
      <div class="sidebar-foot">
        <button id="theme-toggle" class="ghost-btn" type="button">Dark mode</button>
        <p class="api-state" id="api-state">checking API…</p>
      </div>
    </aside>

    <main class="canvas">
      <header class="topbar">
        <h1 id="view-title">Upload</h1>
        <div class="auth-box">
          <label for="api-key">API key</label>
          <input id="api-key" type="password" placeholder="X-API-Key" autocomplete="off" />
          <button id="api-key-save" class="ghost-btn" type="button">Save</button>
        </div>
      </header>

      <div id="banner" class="banner" hidden></div>
      <div id="view" class="view"></div>
    </main>
  </div>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
